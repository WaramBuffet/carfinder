  <body>
    <main>
      <h1>GRAVEL / ELECTRIC – Euer Premium-Carfinder</h1>
      <p>Euer persönlicher Premium-Carfinder: Porsche Taycan Sport und Cross Turismo, BMW iX3, Volvo EX60, elektrischer Mercedes GLC und BMW i5 Touring – mit Angebotspreisen, Leasing und Förderung.</p>
      <p><a href="../?ansicht=premium">Fahrzeugvergleich öffnen</a></p>
    </main>
    <script>
      (() => {
        // Nur im Browser weiterleiten: Link-Crawler verwenden die statischen OG-Metadaten.
        const current = new URL(window.location.href);
        const destination = new URL("../?ansicht=premium", current);
        current.searchParams.forEach((value, key) => {
          if (key !== "ansicht") destination.searchParams.append(key, value);
        });
        destination.hash = current.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </body>
