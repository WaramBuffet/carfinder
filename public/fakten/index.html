  <body>
    <main>
      <h1>Preiswerte E-Autos im Vergleich – Zahlen &amp; Fakten</h1>
      <p>16 kompakte Elektroautos im sachlichen Vergleich mit Preisen, Reichweite, Verbrauch, Ladezeiten, Leasing und Modellfotos.</p>
      <p><a href="../?ansicht=fakten">Fahrzeugvergleich öffnen</a></p>
    </main>
    <script>
      (() => {
        // Nur im Browser weiterleiten: Link-Crawler verwenden die statischen OG-Metadaten.
        const current = new URL(window.location.href);
        const destination = new URL("../?ansicht=fakten", current);
        current.searchParams.forEach((value, key) => {
          if (key !== "ansicht") destination.searchParams.append(key, value);
        });
        destination.hash = current.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </body>
